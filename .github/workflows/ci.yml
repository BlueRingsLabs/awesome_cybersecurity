# Continuous integration for the awesome_cybersecurity knowledge base.
#
# Every push and pull request is gated on the same checks a contributor runs
# locally: lint, format, type-check, the full test suite at 100 % coverage,
# and the repository policy check (`cyberkb check`) which proves the committed
# catalogs, README index and category pages are exactly what the current
# library would generate.
#
# Supply-chain hardening (see docs/adr/0006-supply-chain-hardening.md):
#   * every action is pinned to a full commit SHA, never a mutable tag;
#   * the default GITHUB_TOKEN is read-only for the whole workflow;
#   * jobs declare only the scopes they need.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Least privilege by default; individual jobs widen only what they need.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test and policy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict type-check)
        run: uv run mypy

      - name: Pytest (100% coverage gate)
        run: uv run pytest

      - name: Lint GitHub Actions workflows (actionlint)
        run: uv run actionlint -color

      - name: Repository policy check
        run: uv run cyberkb check
